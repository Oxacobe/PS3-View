name: Build STATION PS3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Native PS3 homebrew build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/02900/ps3-toolchain-tiny3d:latest
    steps:
      - name: Check out STATION
        uses: actions/checkout@v4
      - name: Check cross-compiler
        shell: bash
        run: |
          echo "PS3DEV=${PS3DEV}"
          echo "PSL1GHT=${PSL1GHT}"
          command -v powerpc64-ps3-elf-gcc || command -v ppu-gcc
          test -f "${PSL1GHT}/ppu_rules"
      - name: Generate smooth scalable UI font
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil fonts-dejavu-core
          python3 assets/gen_font.py
      - name: Generate premium XMB artwork
        shell: bash
        run: python3 assets/create_icon.py
      - name: Compile and build installable PKG
        shell: bash
        run: |
          set -e
          make pkg
          echo "Generated build files:"
          find . -maxdepth 2 -type f \( -iname '*.pkg' -o -iname '*.self' -o -name 'EBOOT.BIN' \) -print
          echo "Require an actual non-empty installable package:"
          find . -maxdepth 2 -type f -iname '*.pkg' -size +0c -print -quit | grep -q .
      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: station-ps3-build
          if-no-files-found: error
          path: |
            assets/ICON0.PNG
            *.pkg
            *.self
            EBOOT.BIN
      - name: Name installer for download
        shell: bash
        run: cp station.pkg STATION_NOVA_1.8.pkg
      - name: Publish public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-1.8
          name: STATION NOVA 1.8
          body: "Tap STATION_NOVA_1.8.pkg below to download. Installs separately from earlier versions."
          files: STATION_NOVA_1.8.pkg
          make_latest: true
